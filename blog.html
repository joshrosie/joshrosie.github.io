<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing — Joshua Rosenthal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
    <a href="/" class="back-link">&#8592; Home</a>
    <h1 class="page-title">Writing</h1>
    <div class="post-list" id="post-list">
        <p class="empty-note">Loading&hellip;</p>
    </div>
</div>

<script>
fetch('posts/posts.json')
    .then(r => r.ok ? r.json() : [])
    .then(posts => {
        const list = document.getElementById('post-list');
        if (!posts.length) {
            list.innerHTML = '<p class="empty-note">No posts yet.</p>';
            return;
        }
        list.innerHTML = posts.map(p => `
            <a class="post-item" href="post.html?slug=${encodeURIComponent(p.slug)}">
                <span class="post-date">${p.date}</span>
                <h3>${p.title}</h3>
                ${p.summary ? `<p>${p.summary}</p>` : ''}
            </a>`).join('');
    })
    .catch(() => {
        document.getElementById('post-list').innerHTML =
            '<p class="empty-note">Could not load posts.</p>';
    });
</script>

</body>
</html>
